name: Update KMEM Weather

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch METAR
        run: |
          curl -s "https://aviationweather.gov/api/data/metar?ids=KMEM&format=raw&taf=false" > metar.txt

      - name: Fetch TAF
        run: |
          curl -s "https://aviationweather.gov/api/data/taf?ids=KMEM&format=raw" > taf.txt

      - name: Build weather.json
        run: |
          python3 - << 'EOF'
          import json
          from datetime import datetime, timezone

          metar = open("metar.txt","r",encoding="utf-8",errors="ignore").read().strip()
          taf = open("taf.txt","r",encoding="utf-8",errors="ignore").read().strip()

          data = {
            "metar": metar,
            "taf": taf,
            "lastUpdatedZ": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%MZ")
          }

          with open("weather.json","w") as f:
            json.dump(data,f,indent=2)

          EOF

      - name: Commit weather.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add weather.json
          git diff --cached --quiet || git commit -m "Update weather"
          git push
