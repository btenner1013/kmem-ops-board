name: Update KMEM Weather

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch METAR
        run: |
          curl -L -s "https://aviationweather.gov/api/data/metar?ids=KMEM&format=raw&taf=false" > metar.txt

      - name: Fetch TAF
        run: |
          curl -L -s "https://aviationweather.gov/api/data/taf?ids=KMEM&format=raw" > taf.txt

      - name: Fetch D-ATIS
        run: |
          curl -L -s -A "Mozilla/5.0" "https://atisrelay.com/datis/KMEM" > atis.html || true

      - name: Build weather.json
        run: |
          python3 - << 'EOF'
          import json
          import re
          from datetime import datetime, timezone
          from html import unescape

          def read_file(path):
              try:
                  return open(path, "r", encoding="utf-8", errors="ignore").read()
              except Exception:
                  return ""

          def html_to_text(html):
              html = re.sub(r"(?is)<script.*?</script>", " ", html)
              html = re.sub(r"(?is)<style.*?</style>", " ", html)
              html = re.sub(r"(?is)<[^>]+>", " ", html)
              text = unescape(html)
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          metar = read_file("metar.txt").strip()
          taf = read_file("taf.txt").strip()

          raw_atis = html_to_text(read_file("atis.html"))

          atis_display = "D-ATIS unavailable"

          if "KMEM" in raw_atis.upper() or "MEM" in raw_atis.upper():
              atis_display = raw_atis[:1500]

          data = {
              "metar": metar or "METAR unavailable",
              "taf": taf or "TAF unavailable",
              "atisText": atis_display,
              "atisSource": "https://atisrelay.com/datis/KMEM",
              "lastUpdatedZ": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%MZ")
          }

          with open("weather.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          EOF

      - name: Commit weather.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add weather.json

          git diff --cached --quiet || \
          git commit -m "Update weather and ATIS"

          git push
