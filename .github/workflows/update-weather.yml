name: Update KMEM Weather

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get METAR
        run: |
          curl -s "https://aviationweather.gov/api/data/metar?ids=KMEM&format=raw&taf=false" > metar.txt

      - name: Get TAF
        run: |
          curl -s "https://aviationweather.gov/api/data/taf?ids=KMEM&format=raw" > taf.txt

      - name: Create weather.json
        run: |
          METAR=$(cat metar.txt | jq -Rs .)
          TAF=$(cat taf.txt | jq -Rs .)

          echo "{
            \"metar\": $METAR,
            \"taf\": $TAF,
            \"lastUpdatedZ\": \"$(date -u +'%Y-%m-%d %H:%MZ')\"
          }" > weather.json

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git diff --cached --quiet || git commit -m "Update KMEM weather"

          git push
