<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KMEM Meteogram Cloud Scenario Gallery</title>
  <link rel="stylesheet" href="../../weather-meteogram.css">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;padding:18px;background:#020707;color:#e8f7f4;font-family:Arial,sans-serif}
    header{max-width:1280px;margin:0 auto 14px;padding:12px 14px;border:1px solid rgba(34,211,238,.45);background:#071011}
    h1{margin:0;color:#65edf0;font-size:20px;letter-spacing:.06em}
    header p{margin:5px 0 0;color:#8fa9a7;font-size:12px;font-weight:700}
    main{display:grid;max-width:1280px;margin:0 auto;gap:16px}
    article{overflow:hidden;border:1px solid rgba(34,211,238,.4);border-radius:7px;background:#050909;box-shadow:0 8px 26px rgba(0,0,0,.55)}
    h2{margin:0;padding:9px 12px;border-bottom:1px solid rgba(34,211,238,.3);background:linear-gradient(90deg,rgba(0,255,136,.08),transparent);font-size:13px;letter-spacing:.06em}
    .scenario-window{height:230px;overflow:hidden;background:#050909}
    .scenario-window .aviation-meteogram-stage{height:998px;transform:translateY(-616px)}
    .scenario-window .aviation-meteogram-svg{position:static;width:auto;min-width:100%;height:998px}
    .scenario-note{margin:0;padding:7px 11px;border-top:1px solid rgba(255,255,255,.09);color:#829997;font-size:10px;font-weight:800;letter-spacing:.03em}
    @media(max-width:600px){body{padding:6px}.scenario-window{overflow-x:auto}header{margin-bottom:8px}}
  </style>
</head>
<body>
  <header>
    <h1>KMEM AVIATION METEOGRAM · DETERMINISTIC CLOUD SCENARIOS</h1>
    <p>Production SVG renderer · exact reported bases · symbolic morphology only · no cloud tops or precipitation rates inferred</p>
  </header>
  <main id="scenarioGallery"></main>
  <script type="module" src="./weather-meteogram-cloud-scenarios.js"></script>
</body>
</html>
