<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KMEM Ops Board</title>
<style>
*{box-sizing:border-box}
:root{
  --ops-green:#00ff88;
  --vfr:#00ff88;
  --mvfr:#2d7dff;
  --ifr:#ff3333;
  --lifr:#ff33ff;
  --warning:#ffcc00;
}
body{margin:0;background:#000;color:var(--ops-green);font-family:Arial,sans-serif;overflow:hidden}
.board{height:100vh;width:100vw;display:grid;grid-template-rows:22vh 68vh 10vh;gap:8px;padding:10px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.middle{display:grid;grid-template-columns:42% 58%;gap:8px;min-height:0}
.bottom{display:grid;grid-template-columns:1fr;gap:8px}
.panel{background:#101010;border:2px solid var(--ops-green);padding:12px;overflow:hidden;min-height:0}
.label,.title{color:white;font-weight:bold;letter-spacing:1px}
.label{font-size:1.45vw}
.title{font-size:1.25vw;margin-bottom:6px}
.clock{font-size:5.8vw;font-weight:bold;line-height:1}
.date{color:#ccc;font-size:1.25vw;margin-top:6px}
.flight-category{font-size:3.1vw;font-weight:bold;letter-spacing:2px;margin-bottom:8px}
.cat-vfr{color:var(--vfr)}.cat-mvfr{color:var(--mvfr)}.cat-ifr{color:var(--ifr)}.cat-lifr{color:var(--lifr)}
.raw{font-family:Consolas,monospace;font-size:1.02vw;line-height:1.33;white-space:pre-wrap;overflow:auto;height:calc(100% - 160px)}
.atis-box{margin-top:8px;border-top:1px solid #333;padding-top:8px;font-family:Consolas,monospace;font-size:.9vw;line-height:1.25;white-space:pre-wrap;height:82px;overflow:auto}
.atis-title{color:white;font-family:Arial,sans-serif;font-size:.95vw;font-weight:bold;margin-bottom:3px}
.radar-panel{display:flex;flex-direction:column}
.radarimg{width:100%;height:calc(100% - 32px);object-fit:contain;background:black;border:1px solid #333}
.footer{display:grid;grid-template-columns:1fr 1fr;align-items:center;font-size:1.55vw;font-weight:bold}
.footer-right{text-align:right}
.warn{color:var(--warning)}
.stale{color:var(--warning);animation:blink 1s step-start infinite}
.hidden{display:none}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div class="board">
  <div class="top">
    <div class="panel">
      <div class="label">MEMPHIS LOCAL TIME</div>
      <div id="local" class="clock">--:--:--</div>
      <div id="localDate" class="date">Loading date...</div>
    </div>
    <div class="panel">
      <div class="label">ZULU / UTC</div>
      <div id="zulu" class="clock">--:--:--Z</div>
      <div id="zuluDate" class="date">Loading UTC date...</div>
    </div>
  </div>

  <div class="middle">
    <div class="panel">
      <div class="title">WEATHER</div>
      <div id="category" class="flight-category">--</div>
      <div id="weather" class="raw">Loading KMEM weather...</div>
      <div id="atisBox" class="atis-box hidden">
        <div class="atis-title">D-ATIS</div>
        <div id="atis">Loading D-ATIS...</div>
      </div>
    </div>

    <div class="panel radar-panel">
      <div class="title">RADAR</div>
      <img id="radar" class="radarimg" src="https://radar.weather.gov/ridge/standard/KNQA_loop.gif">
    </div>
  </div>

  <div class="bottom">
    <div class="panel footer">
      <div>WX UPDATED: <span id="lastRefresh">--:--Z</span></div>
      <div id="staleWarning" class="footer-right">RADAR AUTO REFRESH</div>
    </div>
  </div>
</div>

<script>
function updateClock(){
  const now=new Date();
  document.getElementById("local").textContent=now.toLocaleTimeString("en-US",{hour12:false});
  document.getElementById("localDate").textContent=now.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  document.getElementById("zulu").textContent=now.toISOString().substring(11,19)+"Z";
  document.getElementById("zuluDate").textContent="UTC Date: "+now.toISOString().substring(0,10);
}

function parseVisibilitySM(metar){
  const tokens=metar.split(/\s+/);
  for(let i=0;i<tokens.length;i++){
    if(tokens[i]==="SM"&&i>0)return parseVisibilityToken(tokens[i-1]);
    if(tokens[i].endsWith("SM"))return parseVisibilityToken(tokens[i].replace("SM",""));
  }
  return null;
}

function parseVisibilityToken(token){
  token=token.trim();
  if(token.includes("/")){
    const parts=token.split("/");
    if(parts.length===2)return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  const value=parseFloat(token);
  return isNaN(value)?null:value;
}

function parseCeilingFeet(metar){
  const tokens=metar.split(/\s+/);
  let ceiling=null;
  tokens.forEach(token=>{
    const match=token.match(/^(BKN|OVC|VV)(\d{3})/);
    if(match){
      const feet=parseInt(match[2],10)*100;
      if(ceiling===null||feet<ceiling)ceiling=feet;
    }
  });
  return ceiling;
}

function determineFlightCategory(metar){
  const vis=parseVisibilitySM(metar);
  const ceiling=parseCeilingFeet(metar);
  if((ceiling!==null&&ceiling<500)||(vis!==null&&vis<1))return"LIFR";
  if((ceiling!==null&&ceiling<1000)||(vis!==null&&vis<3))return"IFR";
  if((ceiling!==null&&ceiling<=3000)||(vis!==null&&vis<=5))return"MVFR";
  return"VFR";
}

function setCategoryDisplay(category){
  const box=document.getElementById("category");
  box.className="flight-category";
  if(category==="VFR")box.classList.add("cat-vfr");
  if(category==="MVFR")box.classList.add("cat-mvfr");
  if(category==="IFR")box.classList.add("cat-ifr");
  if(category==="LIFR")box.classList.add("cat-lifr");
  box.textContent=category;
}

function isWeatherStale(lastUpdatedZ){
  if(!lastUpdatedZ||lastUpdatedZ==="Pending")return true;
  const normalized=lastUpdatedZ.replace(" ","T").replace("Z",":00Z");
  const updated=new Date(normalized);
  if(isNaN(updated.getTime()))return false;
  return((new Date()-updated)/60000)>15;
}

function updateStaleWarning(lastUpdatedZ){
  const warning=document.getElementById("staleWarning");
  if(isWeatherStale(lastUpdatedZ)){
    warning.textContent="WX DATA STALE";
    warning.className="footer-right stale";
  }else{
    warning.textContent="RADAR AUTO REFRESH";
    warning.className="footer-right";
  }
}

function updateAtisDisplay(atisText){
  const box=document.getElementById("atisBox");
  const atis=document.getElementById("atis");
  const text=(atisText||"").trim();

  if(text && text.toUpperCase()!=="D-ATIS UNAVAILABLE" && text.length>20){
    box.classList.remove("hidden");
    atis.textContent=text;
    document.getElementById("weather").style.height="calc(100% - 160px)";
  }else{
    box.classList.add("hidden");
    atis.textContent="";
    document.getElementById("weather").style.height="calc(100% - 70px)";
  }
}

async function loadWeatherJson(){
  try{
    const response=await fetch("weather.json?t="+new Date().getTime(),{cache:"no-store"});
    if(!response.ok)throw new Error("Unable to load weather.json");
    const data=await response.json();
    const metar=data.metar||"METAR unavailable";
    const taf=data.taf||"TAF unavailable";

    document.getElementById("weather").textContent=metar+"\n\n"+taf;
    updateAtisDisplay(data.atisText);
    setCategoryDisplay(determineFlightCategory(metar));
    document.getElementById("lastRefresh").textContent=data.lastUpdatedZ||"--:--Z";
    updateStaleWarning(data.lastUpdatedZ);
  }catch(e){
    document.getElementById("weather").innerHTML='<span class="warn">Unable to load weather.json</span>';
    updateAtisDisplay("");
    document.getElementById("category").textContent="--";
    document.getElementById("lastRefresh").textContent="--:--Z";
    updateStaleWarning(null);
  }
}

function refreshRadar(){
  document.getElementById("radar").src="https://radar.weather.gov/ridge/standard/KNQA_loop.gif?t="+new Date().getTime();
}

updateClock();
loadWeatherJson();
refreshRadar();

setInterval(updateClock,1000);
setInterval(loadWeatherJson,300000);
setInterval(refreshRadar,300000);

// Full webpage refresh every 30 minutes to prevent stale browser state.
setTimeout(()=>{window.location.reload()},1800000);
</script>
</body>
</html>
